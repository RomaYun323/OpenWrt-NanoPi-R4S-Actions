name: Update third-party plugins

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-third-party-plugins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update all discovered lock files
        run: python3 scripts/update-third-party-locks.py

      - name: Inspect changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- configs/*.lock; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo '### All selected plugins are already up to date' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            {
              echo '### Third-party lock updates'
              echo
              echo '```diff'
              git diff -- configs/*.lock
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit lock updates
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/*.lock
          git commit -m 'Update third-party plugin locks'
          git push origin HEAD:${GITHUB_REF_NAME}
          echo "### Lock files updated on ${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
