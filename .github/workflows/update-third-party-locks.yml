name: Update third-party plugin locks

on:
  workflow_dispatch:
    inputs:
      update_aurora:
        description: Update Aurora
        type: boolean
        default: true
      update_arwi:
        description: Update Arwi Dashboard
        type: boolean
        default: true
      update_bandix:
        description: Update Bandix
        type: boolean
        default: true
      update_adguardhome:
        description: Update AdGuard Home LuCI
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-third-party-plugin-locks
  cancel-in-progress: false

jobs:
  update:
    name: Update lock files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate selection
        env:
          UPDATE_AURORA: ${{ inputs.update_aurora }}
          UPDATE_ARWI: ${{ inputs.update_arwi }}
          UPDATE_BANDIX: ${{ inputs.update_bandix }}
          UPDATE_ADGUARDHOME: ${{ inputs.update_adguardhome }}
        run: |
          if [[ "$UPDATE_AURORA" != "true" && \
                "$UPDATE_ARWI" != "true" && \
                "$UPDATE_BANDIX" != "true" && \
                "$UPDATE_ADGUARDHOME" != "true" ]]; then
            echo "Select at least one plugin group." >&2
            exit 1
          fi

      - name: Update lock files
        env:
          UPDATE_AURORA: ${{ inputs.update_aurora }}
          UPDATE_ARWI: ${{ inputs.update_arwi }}
          UPDATE_BANDIX: ${{ inputs.update_bandix }}
          UPDATE_ADGUARDHOME: ${{ inputs.update_adguardhome }}
        run: python3 scripts/update-third-party-locks.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- configs/*source*.lock; then
            echo "All selected third-party plugins are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/*source*.lock
          git commit -m "Update third-party plugin locks"
          git push
